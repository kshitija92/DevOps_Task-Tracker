<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">Task Tracker</a><span class="text-white-50 small">Team workspace</span></div></nav>
<main class="container py-4"><div th:if="${{success}}" class="alert alert-success" th:text="${{success}}"></div><div th:if="${{error}}" class="alert alert-danger" th:text="${{error}}"></div>
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4"><div><p class="text-primary fw-semibold mb-1">OVERVIEW</p><h1 class="page-title">Task dashboard</h1><p class="text-secondary mb-0">Plan work, assign resources and track delivery dates.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="newTask()">+ Add task</button></div>
<div class="row g-3 mb-4"><div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary">All tasks</div><div class="stat" th:text="${total}">0</div></div></div><div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary">Pending</div><div class="stat" th:text="${pending}">0</div></div></div><div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary">In progress</div><div class="stat" th:text="${progress}">0</div></div></div><div class="col-6 col-lg-3"><div class="card p-3"><div class="text-secondary">Completed</div><div class="stat" th:text="${done}">0</div></div></div></div>
<div class="card p-3 mb-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Task tracker</h5><input id="taskSearch" class="form-control w-auto" placeholder="Search tasks..." oninput="filterRows()"></div><div class="table-responsive"><table class="table align-middle" id="taskTable"><thead><tr><th>Task</th><th>Resource</th><th>Start</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="t : ${tasks}"><td><strong th:text="${t.title}"></strong><div class="small text-secondary" th:text="${t.description}"></div></td><td th:text="${resources.?[id == __${t.resourceId}__].size() > 0 ? resources.?[id == __${t.resourceId}__][0].name : 'Unknown'}"></td><td th:text="${t.startDate}"></td><td th:text="${t.dueDate}"></td><td><span class="badge text-bg-secondary" th:text="${t.status}"></span></td><td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" th:attr="data-id=${t.id},data-title=${t.title},data-description=${t.description},data-resource=${t.resourceId},data-start=${t.startDate},data-due=${t.dueDate},data-status=${t.status}" onclick="editTask(this)">Edit</button><form class="d-inline" th:action="@{/tasks/delete/{id}(id=${t.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this task?')">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(tasks)}"><td colspan="6" class="text-center text-secondary py-4">No tasks yet. Add your first task.</td></tr></tbody></table></div></div>
<div class="card p-3"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Resources</h5><button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#resourceModal">+ Add resource</button></div><div class="row g-3"><div class="col-md-6 col-lg-4" th:each="r : ${resources}"><div class="border rounded-3 p-3 bg-white"><div class="fw-semibold" th:text="${r.name}"></div><div class="small text-secondary" th:text="${r.role}"></div><div class="small" th:text="${r.email}"></div><form class="mt-2" th:action="@{/resources/delete/{id}(id=${r.id})}" method="post"><button class="btn btn-sm btn-link text-danger p-0" onclick="return confirm('Delete resource and assigned tasks?')">Remove resource</button></form></div></div></div></div></main>
<div class="modal fade" id="resourceModal"><div class="modal-dialog"><form class="modal-content" action="/resources/save" method="post"><div class="modal-header"><h5>Add resource</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Role</label><input class="form-control mb-3" name="role" required><label class="form-label">Email</label><input class="form-control" type="email" name="email"></div><div class="modal-footer"><button class="btn btn-primary">Save resource</button></div></form></div></div>
<div class="modal fade" id="taskModal"><div class="modal-dialog"><form class="modal-content" action="/tasks/save" method="post"><input type="hidden" name="id" id="taskId"><div class="modal-header"><h5 id="taskModalTitle">Add task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Task title</label><input class="form-control mb-3" name="title" id="taskTitle" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" id="taskDescription"></textarea><label class="form-label">Assign resource</label><select class="form-select mb-3" name="resourceId" id="taskResource" required><option value="">Select resource</option><option th:each="r : ${resources}" th:value="${r.id}" th:text="${r.name}"></option></select><div class="row"><div class="col"><label class="form-label">Start date</label><input class="form-control mb-3" type="date" name="startDate" id="taskStart" required></div><div class="col"><label class="form-label">Due date</label><input class="form-control mb-3" type="date" name="dueDate" id="taskDue" required></div></div><label class="form-label">Status</label><select class="form-select" name="status" id="taskStatus"><option>PENDING</option><option>IN_PROGRESS</option><option>COMPLETED</option></select></div><div class="modal-footer"><button class="btn btn-primary">Save task</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>
function newTask(){document.getElementById('taskId').value='0';document.getElementById('taskModalTitle').textContent='Add task';document.getElementById('taskTitle').value='';document.getElementById('taskDescription').value='';document.getElementById('taskResource').value='';let d=new Date().toISOString().slice(0,10);document.getElementById('taskStart').value=d;document.getElementById('taskDue').value=d;document.getElementById('taskStatus').value='PENDING';}
function editTask(b){document.getElementById('taskId').value=b.dataset.id;document.getElementById('taskModalTitle').textContent='Edit task';document.getElementById('taskTitle').value=b.dataset.title;document.getElementById('taskDescription').value=b.dataset.description;document.getElementById('taskResource').value=b.dataset.resource;document.getElementById('taskStart').value=b.dataset.start;document.getElementById('taskDue').value=b.dataset.due;document.getElementById('taskStatus').value=b.dataset.status;new bootstrap.Modal(document.getElementById('taskModal')).show();}
function filterRows(){let q=document.getElementById('taskSearch').value.toLowerCase();document.querySelectorAll('#taskTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none');}
</script></body></html>
